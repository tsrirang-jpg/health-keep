name: HealthKeep checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: healthkeep_test
          POSTGRES_USER: healthkeep_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U healthkeep_test -d healthkeep_test" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/healthkeep_test
      DATABASE_USER: healthkeep_test
      DATABASE_PASSWORD: synthetic-ci-password
      JWT_SECRET: synthetic-ci-only-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
        working-directory: backend
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run export:web
